[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sendou-ink-sdk"
version = "1.0.0"
description = "Async Python SDK for the sendou.ink public API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jason Jiménez Cruz" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
docs = ["mkdocs-material>=9.5"]
build = [
  "build>=1.2",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://sendou.ink"
Repository = "https://github.com/jasonjimnz/sendou_ink_sdk"
Documentation = "https://jasonjimnz.github.io/sendou_ink_sdk/"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sendou_sdk" = ["py.typed"]
